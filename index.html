<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AeroFly — Premium Travel</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<style>
/* ================================================================
   INDEX — landing page only styles
================================================================ */

body { overflow-x: hidden; }

/* ── Hero ─────────────────────────────────────────────────────── */
.hero {
  min-height: 100vh;
  background: #0F172A;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* animated star field */
.stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}
.stars span {
  position: absolute;
  border-radius: 50%;
  background: white;
  animation: twinkle var(--d) ease-in-out infinite alternate;
  opacity: 0;
}
@keyframes twinkle {
  from { opacity: 0; transform: scale(.8); }
  to   { opacity: var(--o); transform: scale(1.2); }
}

/* gradient glow blobs */
.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
}
.blob-1 {
  width: 600px; height: 600px;
  background: rgba(66,133,244,.15);
  top: -150px; left: -100px;
  animation: drift 12s ease-in-out infinite alternate;
}
.blob-2 {
  width: 500px; height: 500px;
  background: rgba(155,114,203,.12);
  top: 100px; right: -120px;
  animation: drift 9s ease-in-out infinite alternate-reverse;
}
.blob-3 {
  width: 400px; height: 400px;
  background: rgba(217,101,112,.1);
  bottom: -80px; left: 40%;
  animation: drift 14s ease-in-out infinite alternate;
}
@keyframes drift {
  from { transform: translate(0, 0) scale(1); }
  to   { transform: translate(30px, 20px) scale(1.06); }
}

/* ── Header (dark variant) ─────────────────────────────────────── */
header {
  background: transparent;
  border-bottom: 1px solid rgba(255,255,255,.08);
  position: relative;
  z-index: 10;
}
header .logo { color: white; }
.icon-btn { color: rgba(255,255,255,.6); }
.icon-btn:hover { background: rgba(255,255,255,.1); color: white; }
.profile-char { background: rgba(255,255,255,.1); color: rgba(255,255,255,.8); border-color: rgba(255,255,255,.2); }
.hamburger span { background: white; }

/* ── Hero content ──────────────────────────────────────────────── */
.hero-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4rem 5% 3rem;
  position: relative;
  z-index: 2;
}

.hero-eyebrow {
  font-family: 'Outfit', sans-serif;
  font-size: .75rem;
  font-weight: 600;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--gemini-purple);
  margin-bottom: 1.2rem;
  display: flex;
  align-items: center;
  gap: .5rem;
}
.hero-eyebrow::before,
.hero-eyebrow::after {
  content: '';
  width: 32px; height: 1px;
  background: var(--gemini-purple);
  opacity: .5;
}

.hero-title {
  font-family: 'Outfit', sans-serif;
  font-size: clamp(2.6rem, 6vw, 5rem);
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -.03em;
  color: white;
  text-align: center;
  margin-bottom: 1.2rem;
  max-width: 820px;
}

.hero-title .grad {
  background: var(--gemini-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero-sub {
  font-size: 1.05rem;
  color: rgba(255,255,255,.5);
  text-align: center;
  max-width: 480px;
  line-height: 1.7;
  margin-bottom: 3rem;
}

/* ── Search card ───────────────────────────────────────────────── */
.search-card {
  background: rgba(255,255,255,.04);
  backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 28px;
  padding: 1.8rem;
  width: 100%;
  max-width: 860px;
  box-shadow: 0 32px 80px rgba(0,0,0,.4);
}

/* ── Mode tabs ─────────────────────────────────────────────────── */
.mode-tabs {
  display: flex;
  gap: .4rem;
  margin-bottom: 1.6rem;
  background: rgba(255,255,255,.05);
  border-radius: 14px;
  padding: 4px;
  width: fit-content;
}
.mode-tab {
  font-family: 'Outfit', sans-serif;
  font-size: .85rem;
  font-weight: 600;
  padding: .5rem 1.2rem;
  border-radius: 10px;
  border: none;
  background: transparent;
  color: rgba(255,255,255,.5);
  cursor: pointer;
  transition: all .2s;
  display: flex;
  align-items: center;
  gap: .45rem;
}
.mode-tab.active {
  background: white;
  color: var(--text-dark);
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}
.mode-tab:hover:not(.active) {
  color: rgba(255,255,255,.85);
  background: rgba(255,255,255,.08);
}

/* ── Search panels ─────────────────────────────────────────────── */
.search-panel { display: none; }
.search-panel.active { display: block; }

/* ── Field rows ────────────────────────────────────────────────── */
.fields-row {
  display: grid;
  gap: .75rem;
  margin-bottom: .75rem;
}
.fields-row.cols-2 { grid-template-columns: 1fr 1fr; }
.fields-row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.fields-row.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

.field {
  display: flex;
  flex-direction: column;
  gap: .3rem;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 14px;
  padding: .75rem 1rem;
  cursor: pointer;
  transition: all .2s;
  position: relative;
}
.field:hover, .field:focus-within {
  background: rgba(255,255,255,.11);
  border-color: rgba(155,114,203,.5);
}

.field label {
  font-family: 'Outfit', sans-serif;
  font-size: .67rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: rgba(255,255,255,.45);
  pointer-events: none;
}

.field input,
.field select {
  background: transparent;
  border: none;
  outline: none;
  font-family: 'Roboto', sans-serif;
  font-size: .95rem;
  font-weight: 500;
  color: white;
  width: 100%;
  cursor: pointer;
}
.field select option { background: #1E293B; color: white; }
.field input::placeholder { color: rgba(255,255,255,.3); }

/* swap button between From/To */
.swap-wrap {
  display: flex;
  align-items: stretch;
  gap: .75rem;
}
.swap-btn {
  width: 40px;
  flex-shrink: 0;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 14px;
  color: rgba(255,255,255,.5);
  font-size: .95rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .2s;
  align-self: stretch;
}
.swap-btn:hover {
  background: rgba(155,114,203,.2);
  border-color: rgba(155,114,203,.4);
  color: white;
  transform: rotate(180deg);
}

/* traveler rows inside popup */
.travelers-popup-wrap {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  right: 0;
  background: #1E293B;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 16px;
  padding: 1rem;
  z-index: 200;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
  display: none;
}
.travelers-popup-wrap.open { display: block; }

.t-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: .55rem 0;
  border-bottom: 1px solid rgba(255,255,255,.07);
}
.t-row:last-of-type { border-bottom: none; }
.t-label { color: white; font-weight: 600; font-size: .9rem; }
.t-age { font-size: .72rem; color: rgba(255,255,255,.4); }

.t-counter { display: flex; align-items: center; gap: .5rem; }
.t-btn {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,.2);
  background: transparent;
  color: white;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s;
  line-height: 1;
}
.t-btn:hover:not(:disabled) { border-color: var(--gemini-purple); color: var(--gemini-purple); }
.t-btn:disabled { opacity: .3; cursor: not-allowed; }
.t-val { min-width: 20px; text-align: center; font-weight: 700; color: white; font-family: 'Outfit', sans-serif; }

.t-done {
  width: 100%;
  margin-top: .75rem;
  background: var(--gemini-gradient);
  border: none;
  border-radius: 10px;
  padding: .55rem;
  color: white;
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  font-size: .85rem;
  cursor: pointer;
}

/* ── Trip type pills ───────────────────────────────────────────── */
.trip-pills {
  display: flex;
  gap: .4rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}
.trip-pill {
  font-family: 'Outfit', sans-serif;
  font-size: .75rem;
  font-weight: 600;
  padding: .3rem .75rem;
  border-radius: 20px;
  border: 1.5px solid rgba(255,255,255,.15);
  background: transparent;
  color: rgba(255,255,255,.5);
  cursor: pointer;
  transition: all .2s;
}
.trip-pill.active {
  border-color: var(--gemini-purple);
  background: rgba(155,114,203,.2);
  color: white;
}

/* ── Search button ─────────────────────────────────────────────── */
.search-btn-row {
  display: flex;
  justify-content: flex-end;
  margin-top: .75rem;
}
.search-btn {
  background: var(--gemini-gradient);
  color: white;
  border: none;
  border-radius: 14px;
  padding: .9rem 2.4rem;
  font-family: 'Outfit', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: .6rem;
  transition: all .2s;
  box-shadow: 0 8px 24px rgba(155,114,203,.35);
}
.search-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(155,114,203,.45);
}
.search-btn i { font-size: 1rem; }

/* ── Trust bar ─────────────────────────────────────────────────── */
.trust-bar {
  display: flex;
  gap: 2.5rem;
  justify-content: center;
  padding: 1.5rem 5%;
  position: relative;
  z-index: 2;
  border-top: 1px solid rgba(255,255,255,.06);
  flex-wrap: wrap;
}
.trust-item {
  display: flex;
  align-items: center;
  gap: .5rem;
  font-size: .8rem;
  color: rgba(255,255,255,.35);
  font-family: 'Outfit', sans-serif;
  font-weight: 500;
}
.trust-item i { color: rgba(255,255,255,.25); font-size: .85rem; }

/* ── Responsive ────────────────────────────────────────────────── */
@media (max-width: 700px) {
  .fields-row.cols-4 { grid-template-columns: 1fr 1fr; }
  .fields-row.cols-3 { grid-template-columns: 1fr 1fr; }
  .fields-row.cols-2 { grid-template-columns: 1fr; }
  .swap-wrap { flex-direction: column; }
  .swap-btn  { width: 100%; height: 40px; }
  .search-btn-row { justify-content: stretch; }
  .search-btn { width: 100%; justify-content: center; }
  .hero-title { font-size: 2.4rem; }
}

/* nav dropdown dark override */
.nav-dropdown {
  background: rgba(15,23,42,.95);
  border-color: rgba(255,255,255,.1);
}
.nav-dropdown a { color: rgba(255,255,255,.8); border-bottom-color: rgba(255,255,255,.08); }
.nav-dropdown a:hover { background: rgba(255,255,255,.05); color: white; }
</style>
</head>
<body>

<div class="hero">
  <div class="stars" id="stars"></div>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- HEADER -->
  <header>
    <div class="logo-menu-group">
      <div class="hamburger" id="menuToggle">
        <span></span><span></span><span></span>
      </div>
      <div class="logo">
        <i class="fa-solid fa-sparkles" style="font-size:1.1rem;margin-right:6px;"></i>AeroFly
      </div>
    </div>
    <div class="nav-dropdown" id="navDropdown">
      <a href="index.html" class="active-link"><i class="fa-solid fa-house" style="margin-right:8px;"></i> Home</a>
      <a href="https://daydreamofyou1-coder.github.io/dreamo/dreamo-fixed/pages/aerofly.html"><i class="fa-solid fa-plane-up" style="margin-right:8px;"></i> Flights</a>
      <a href="https://daydreamofyou1-coder.github.io/dreamo/dreamo-fixed/pages/aerohotel.html"><i class="fa-solid fa-bed" style="margin-right:8px;"></i> Hotels</a>
    </div>
    <div class="user-actions">
      <button class="icon-btn" title="Notifications">
        <i class="fa-regular fa-bell"></i>
        <div class="notification-badge"></div>
      </button>
      <div class="profile-char" title="Account">
        <i class="fa-solid fa-user-astronaut"></i>
      </div>
    </div>
  </header>

  <!-- HERO BODY -->
  <div class="hero-body">
    <div class="hero-eyebrow">Your Journey Starts Here</div>

    <h1 class="hero-title">
      Travel <span class="grad">smarter,</span><br>fly further.
    </h1>

    <p class="hero-sub">
      Flights, hotels and experiences — search once and go.
    </p>

    <!-- SEARCH CARD -->
    <div class="search-card">

      <!-- Mode tabs: Flights / Hotels -->
      <div class="mode-tabs">
        <button class="mode-tab active" id="tab-flights" onclick="switchMode('flights')">
          <i class="fa-solid fa-plane-up"></i> Flights
        </button>
        <button class="mode-tab" id="tab-hotels" onclick="switchMode('hotels')">
          <i class="fa-solid fa-bed"></i> Hotels
        </button>
      </div>

      <!-- ── FLIGHTS PANEL ── -->
      <div class="search-panel active" id="panel-flights">

        <!-- Trip type -->
        <div class="trip-pills">
          <button class="trip-pill active" onclick="setTrip(this,'return')">Return</button>
          <button class="trip-pill" onclick="setTrip(this,'oneway')">One-way</button>
          <button class="trip-pill" onclick="setTrip(this,'multi')">Multi-city</button>
        </div>

        <!-- From / Swap / To -->
        <div class="swap-wrap" style="margin-bottom:.75rem;">
          <div class="field" style="flex:1;">
            <label>From</label>
            <input type="text" id="f-from" placeholder="City or airport" value="Brussels (BRU)">
          </div>
          <button class="swap-btn" title="Swap" onclick="swapLocations()">
            <i class="fa-solid fa-arrow-right-arrow-left" style="transform:rotate(90deg)"></i>
          </button>
          <div class="field" style="flex:1;">
            <label>To</label>
            <input type="text" id="f-to" placeholder="City or airport" value="Singapore (SIN)">
          </div>
        </div>

        <!-- Dates + Travelers + Class -->
        <div class="fields-row cols-4">
          <div class="field">
            <label>Depart</label>
            <input type="date" id="f-depart" value="">
          </div>
          <div class="field" id="f-return-wrap">
            <label>Return</label>

            <label>Travelers</label>
            <input type="text" id="f-travelers-display" readonly placeholder="1 Adult" style="cursor:pointer;">
            <!-- Travelers mini-popup -->

              <div class="t-row">

                <div><div class="t-label">Children</div><div class="t-age">Age 2–11</div></div>
                <div class="t-counter">
                  <button class="t-btn" id="c-minus" onclick="adj('c',-1)">−</button>

                  <button class="t-btn" onclick="adj('c',1)">+</button>
                </div>
              </div>
              <div class="t-row">
                <div><div class="t-label">Infants</div><div class="t-age">Under 2</div></div>
                <div class="t-counter">
                  <button class="t-btn" id="i-minus" onclick="adj('i',-1)">−</button>
                  <span class="t-val" id="i-val">0</span>

          </div>
          <div class="field">
            <label>Class</label>
            <select id="f-class">
              <option value="economy">Economy</option>
              <option value="premium">Premium</option>
              <option value="first">First Class</option>
            </select>
          </div>
        </div>

        <div class="search-btn-row">
          <button class="search-btn" onclick="searchFlights()">
            <i class="fa-solid fa-magnifying-glass"></i> Search Flights
          </button>
        </div>
      </div>

      <!-- ── HOTELS PANEL ── -->
      <div class="search-panel" id="panel-hotels">

        <!-- Destination -->
        <div class="fields-row cols-2" style="margin-bottom:.75rem;">
          <div class="field" style="grid-column:1/-1;">
            <label>Destination</label>
            <input type="text" id="h-dest" placeholder="City, hotel or landmark" value="Singapore">
          </div>

        <!-- Check-in / Check-out / Guests / Rooms -->
        <div class="fields-row cols-4">
          <div class="field">
            <label>Check-in</label>
            <input type="date" id="h-checkin">
          </div>
          <div class="field">
            <label>Check-out</label>
            <input type="date" id="h-checkout">
          </div>
          <div class="field">
            <label>Guests</label>
            <select id="h-guests">
              <option>1 guest</option>
              <option selected>2 guests</option>
              <option>3 guests</option>
              <option>4 guests</option>
              <option>5+ guests</option>

            <label>Rooms</label>

              <option selected>1 room</option>
              <option>2 rooms</option>

        <div class="search-btn-row">
          <button class="search-btn" onclick="searchHotels()">
            <i class="fa-solid fa-magnifying-glass"></i> Search Hotels
          </button>

      </div>

    </div><!-- /.search-card -->
  </div><!-- /.hero-body -->

  <!-- TRUST BAR -->

    <div class="trust-item"><i class="fa-solid fa-lock"></i> Secure booking</div>
    <div class="trust-item"><i class="fa-solid fa-rotate-left"></i> Free cancellation on most fares</div>
    <div class="trust-item"><i class="fa-solid fa-headset"></i> 24/7 support</div>
    <div class="trust-item"><i class="fa-solid fa-ticket"></i> Best price guarantee</div>
  </div>

</div><!-- /.hero -->

<script src="js/global.js"></script>
<script>
/* ================================================================
   INDEX — search form logic
================================================================ */

// ── Stars ─────────────────────────────────────────────────────
(function buildStars() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('span');
    const size = Math.random() * 2.5 + .5;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      top:${Math.random()*100}%;
      left:${Math.random()*100}%;
      --d:${(Math.random()*4+2).toFixed(1)}s;
      --o:${(Math.random()*.7+.1).toFixed(2)};
      animation-delay:${(Math.random()*5).toFixed(1)}s;
    `;
    container.appendChild(s);
  }
})();

// ── Default dates ──────────────────────────────────────────────
(function setDefaultDates() {
  const pad = n => String(n).padStart(2,'0');
  const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const dep = new Date(); dep.setDate(dep.getDate() + 14);
  const ret = new Date(); ret.setDate(ret.getDate() + 25);
  document.getElementById('f-depart').value  = fmt(dep);
  document.getElementById('f-return').value  = fmt(ret);
  document.getElementById('h-checkin').value  = fmt(dep);
  document.getElementById('h-checkout').value = fmt(ret);
})();

// ── Mode switch ────────────────────────────────────────────────
function switchMode(mode) {
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.search-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + mode).classList.add('active');
  document.getElementById('panel-' + mode).classList.add('active');
}

// ── Trip type pills ────────────────────────────────────────────
function setTrip(el, type) {
  document.querySelectorAll('.trip-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  // Hide return date for one-way
  document.getElementById('f-return-wrap').style.display =
    type === 'oneway' ? 'none' : '';
}

// ── Swap From / To ─────────────────────────────────────────────
function swapLocations() {
  const a = document.getElementById('f-from');
  const b = document.getElementById('f-to');
  [a.value, b.value] = [b.value, a.value];
}

// ── Travelers popup ────────────────────────────────────────────
const PAX = { a: 1, c: 0, i: 0 };

function toggleTravelers(e) {
  e.stopPropagation();
  document.getElementById('travelers-popup').classList.toggle('open');
  updateTravelersBtn();
}
function closeTravelers() {
  document.getElementById('travelers-popup').classList.remove('open');
}
function adj(key, delta) {
  PAX[key] = Math.max(key === 'a' ? 1 : 0, PAX[key] + delta);
  document.getElementById(key + '-val').textContent = PAX[key];
  document.getElementById(key + '-minus').disabled = PAX[key] <= (key === 'a' ? 1 : 0);
  updateTravelersBtn();
}
function updateTravelersBtn() {
  const parts = [];
  if (PAX.a) parts.push(PAX.a + ' Adult' + (PAX.a > 1 ? 's' : ''));
  if (PAX.c) parts.push(PAX.c + ' Child' + (PAX.c > 1 ? 'ren' : ''));
  if (PAX.i) parts.push(PAX.i + ' Infant' + (PAX.i > 1 ? 's' : ''));
  document.getElementById('f-travelers-display').value = parts.join(', ');
}
updateTravelersBtn();

// Close popup when clicking outside
document.addEventListener('click', () => closeTravelers());

// ── Navigate to flights page ───────────────────────────────────
function searchFlights() {
  const from    = document.getElementById('f-from').value.trim();
  const to      = document.getElementById('f-to').value.trim();
  const depart  = document.getElementById('f-depart').value;
  const ret     = document.getElementById('f-return').value;
  const pax     = `${PAX.a}a${PAX.c}c${PAX.i}i`;
  const cls     = document.getElementById('f-class').value;

  // Pass search state as URL params so the flights page can pick them up
  const params = new URLSearchParams({ from, to, depart, return: ret, pax, class: cls });
  window.location.href = `pages/aerofly.html?${params}`;
}

// ── Navigate to hotels page ────────────────────────────────────
function searchHotels() {
  const dest     = document.getElementById('h-dest').value.trim();
  const checkin  = document.getElementById('h-checkin').value;
  const checkout = document.getElementById('h-checkout').value;
  const guests   = document.getElementById('h-guests').value;
  const rooms    = document.getElementById('h-rooms').value;

  const params = new URLSearchParams({ dest, checkin, checkout, guests, rooms });
  window.location.href = `pages/aerohotel.html?${params}`;
}
</script>
