<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AeroFly — Premium Travel</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dreamo-fixed/css/global.css">
<style>
body { overflow-x: hidden; }

.hero {
  min-height: 100vh;
  background: #0F172A;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

.stars { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.stars span {
  position: absolute; border-radius: 50%; background: white;
  animation: twinkle var(--d) ease-in-out infinite alternate; opacity: 0;
}
@keyframes twinkle {
  from { opacity: 0; transform: scale(.8); }
  to   { opacity: var(--o); transform: scale(1.2); }
}

.blob { position: absolute; border-radius: 50%; filter: blur(80px); pointer-events: none; }
.blob-1 { width:600px; height:600px; background:rgba(66,133,244,.15); top:-150px; left:-100px; animation:drift 12s ease-in-out infinite alternate; }
.blob-2 { width:500px; height:500px; background:rgba(155,114,203,.12); top:100px; right:-120px; animation:drift 9s ease-in-out infinite alternate-reverse; }
.blob-3 { width:400px; height:400px; background:rgba(217,101,112,.1); bottom:-80px; left:40%; animation:drift 14s ease-in-out infinite alternate; }
@keyframes drift {
  from { transform: translate(0,0) scale(1); }
  to   { transform: translate(30px,20px) scale(1.06); }
}

header {
  background: transparent;
  border-bottom: 1px solid rgba(255,255,255,.08);
  position: relative; z-index: 10;
}
.icon-btn { color: rgba(255,255,255,.6); }
.icon-btn:hover { background: rgba(255,255,255,.1); color: white; }
.profile-char { background: rgba(255,255,255,.1); color: rgba(255,255,255,.8); border-color: rgba(255,255,255,.2); }
.hamburger span { background: white; }
.nav-dropdown { background: rgba(15,23,42,.95); border-color: rgba(255,255,255,.1); }
.nav-dropdown a { color: rgba(255,255,255,.8); border-bottom-color: rgba(255,255,255,.08); }
.nav-dropdown a:hover { background: rgba(255,255,255,.05); color: white; }

.hero-body {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 4rem 5% 3rem; position: relative; z-index: 2;
}

.hero-eyebrow {
  font-family: 'Outfit', sans-serif; font-size: .75rem; font-weight: 600;
  letter-spacing: .15em; text-transform: uppercase; color: #9B72CB;
  margin-bottom: 1.2rem; display: flex; align-items: center; gap: .5rem;
}
.hero-eyebrow::before, .hero-eyebrow::after { content:''; width:32px; height:1px; background:#9B72CB; opacity:.5; }

.hero-title {
  font-family: 'Outfit', sans-serif;
  font-size: clamp(2.6rem, 6vw, 5rem);
  font-weight: 800; line-height: 1.05; letter-spacing: -.03em;
  color: white; text-align: center; margin-bottom: 1.2rem; max-width: 820px;
}
.hero-title .grad {
  background: linear-gradient(135deg, #4285F4 0%, #9B72CB 50%, #D96570 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

.hero-sub { font-size: 1.05rem; color: rgba(255,255,255,.5); text-align: center; max-width: 480px; line-height: 1.7; margin-bottom: 3rem; }

.search-card {
  background: rgba(255,255,255,.04); backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,.1); border-radius: 28px;
  padding: 1.8rem; width: 100%; max-width: 860px;
  box-shadow: 0 32px 80px rgba(0,0,0,.4);
  position: relative; overflow: hidden;
}

/* ✈️ Animated Airplane Background for Flights Tab */
.bg-plane {
  position: absolute;
  top: 15%;
  left: -20%;
  width: 120px;
  height: 120px;
  opacity: 0;
  pointer-events: none;
  z-index: 0;
  filter: drop-shadow(0 0 15px rgba(66, 133, 244, 0.4));
  transition: opacity 0.5s;
}
.search-card.mode-flights .bg-plane {
  animation: flyBy 15s linear infinite;
  opacity: 0.15;
}
@keyframes flyBy {
  0% { transform: translate(0, 50px) rotate(15deg); }
  50% { transform: translate(500px, -20px) rotate(10deg); }
  100% { transform: translate(1000px, -80px) rotate(5deg); }
}

.mode-tabs {
  display: flex; gap: .4rem; margin-bottom: 1.6rem;
  background: rgba(255,255,255,.05); border-radius: 14px;
  padding: 4px; width: fit-content;
  position: relative; z-index: 2;
}
.mode-tab {
  font-family: 'Outfit', sans-serif; font-size: .85rem; font-weight: 600;
  padding: .5rem 1.2rem; border-radius: 10px; border: none;
  background: transparent; color: rgba(255,255,255,.5);
  cursor: pointer; transition: all .2s; display: flex; align-items: center; gap: .45rem;
}
.mode-tab.active { background: white; color: #0F172A; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
.mode-tab:hover:not(.active) { color: rgba(255,255,255,.85); background: rgba(255,255,255,.08); }

.search-panel { display: none; position: relative; z-index: 2; }
.search-panel.active { display: block; }

.fields-row { display: grid; gap: .75rem; margin-bottom: .75rem; }
.fields-row.cols-2 { grid-template-columns: 1fr 1fr; }
.fields-row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.fields-row.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

.field {
  display: flex; flex-direction: column; gap: .3rem;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1);
  border-radius: 14px; padding: .75rem 1rem;
  cursor: pointer; transition: all .2s; position: relative;
}
.field:hover, .field:focus-within { background: rgba(255,255,255,.11); border-color: rgba(155,114,203,.5); }
.field label {
  font-family: 'Outfit', sans-serif; font-size: .67rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .06em;
  color: rgba(255,255,255,.45); pointer-events: none;
}
.field input, .field select {
  background: transparent; border: none; outline: none;
  font-family: 'Roboto', sans-serif; font-size: .95rem;
  font-weight: 500; color: white; width: 100%; cursor: pointer;
}
.field select option { background: #1E293B; color: white; }
.field input::placeholder { color: rgba(255,255,255,.3); }

.swap-wrap { display: flex; align-items: stretch; gap: .75rem; }
.swap-btn {
  width: 40px; flex-shrink: 0;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1);
  border-radius: 14px; color: rgba(255,255,255,.5);
  font-size: .95rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s; align-self: stretch;
}
.swap-btn:hover { background: rgba(155,114,203,.2); border-color: rgba(155,114,203,.4); color: white; transform: rotate(180deg); }

.travelers-popup-wrap {
  position: absolute; top: calc(100% + 8px); left: 0; right: 0;
  background: #1E293B; border: 1px solid rgba(255,255,255,.12);
  border-radius: 16px; padding: 1rem; z-index: 200;
  box-shadow: 0 20px 60px rgba(0,0,0,.5); display: none;
}
.travelers-popup-wrap.open { display: block; }
.t-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: .55rem 0; border-bottom: 1px solid rgba(255,255,255,.07);
}
.t-row:last-of-type { border-bottom: none; }
.t-label { color: white; font-weight: 600; font-size: .9rem; }
.t-age { font-size: .72rem; color: rgba(255,255,255,.4); }
.t-counter { display: flex; align-items: center; gap: .5rem; }
.t-btn {
  width: 28px; height: 28px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,.2); background: transparent;
  color: white; font-size: 1rem; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all .2s; line-height: 1;
}
.t-btn:hover:not(:disabled) { border-color: #9B72CB; color: #9B72CB; }
.t-btn:disabled { opacity: .3; cursor: not-allowed; }
.t-val { min-width: 20px; text-align: center; font-weight: 700; color: white; font-family: 'Outfit', sans-serif; }
.t-done {
  width: 100%; margin-top: .75rem;
  background: linear-gradient(135deg, #4285F4 0%, #9B72CB 50%, #D96570 100%);
  border: none; border-radius: 10px; padding: .55rem; color: white;
  font-family: 'Outfit', sans-serif; font-weight: 700; font-size: .85rem; cursor: pointer;
}

.trip-pills { display: flex; gap: .4rem; margin-bottom: 1rem; flex-wrap: wrap; }
.trip-pill {
  font-family: 'Outfit', sans-serif; font-size: .75rem; font-weight: 600;
  padding: .3rem .75rem; border-radius: 20px;
  border: 1.5px solid rgba(255,255,255,.15); background: transparent;
  color: rgba(255,255,255,.5); cursor: pointer; transition: all .2s;
}
.trip-pill.active { border-color: #9B72CB; background: rgba(155,114,203,.2); color: white; }

.search-btn-row { display: flex; justify-content: flex-end; margin-top: .75rem; }
.search-btn {
  background: linear-gradient(135deg, #4285F4 0%, #9B72CB 50%, #D96570 100%);
  color: white; border: none; border-radius: 14px;
  padding: .9rem 2.4rem; font-family: 'Outfit', sans-serif;
  font-size: 1rem; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; gap: .6rem; transition: all .2s;
  box-shadow: 0 8px 24px rgba(155,114,203,.35);
}
.search-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(155,114,203,.45); }

.trust-bar {
  display: flex; gap: 2.5rem; justify-content: center;
  padding: 1.5rem 5%; position: relative; z-index: 2;
  border-top: 1px solid rgba(255,255,255,.06); flex-wrap: wrap;
}
.trust-item { display: flex; align-items: center; gap: .5rem; font-size: .8rem; color: rgba(255,255,255,.35); font-family: 'Outfit', sans-serif; font-weight: 500; }
.trust-item i { color: rgba(255,255,255,.25); font-size: .85rem; }

@media (max-width: 700px) {
  .fields-row.cols-4, .fields-row.cols-3 { grid-template-columns: 1fr 1fr; }
  .fields-row.cols-2 { grid-template-columns: 1fr; }
  .swap-wrap { flex-direction: column; }
  .swap-btn  { width: 100%; height: 40px; }
  .search-btn-row { justify-content: stretch; }
  .search-btn { width: 100%; justify-content: center; }
  .hero-title { font-size: 2.4rem; }
}
</style>
</head>
<body>

<div class="hero">
  <div class="stars" id="stars"></div>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <header>
    <div class="logo-menu-group">
      <div class="hamburger" id="menuToggle"><span></span><span></span><span></span></div>
      <div class="logo">
        <i class="fa-solid fa-sparkles" style="font-size:1.1rem;margin-right:6px;"></i>AeroFly
      </div>
    </div>
    <div class="nav-dropdown" id="navDropdown">
      <a href="dreamo-fixed/pages/aerofly.html">
        <i class="fa-solid fa-plane-up" style="margin-right:8px;"></i> Flights
        <span class="nav-dot"></span>
      </a>
      <a href="dreamo-fixed/pages/aerohotel.html">
        <i class="fa-solid fa-bed" style="margin-right:8px;"></i> Hotels
      </a>
      <a href="dreamo-fixed/pages/experiences.html">
        <i class="fa-solid fa-compass" style="margin-right:8px;"></i> Experiences
      </a>
    </div>
    <div class="user-actions">
      <button class="icon-btn" title="Notifications">
        <i class="fa-regular fa-bell"></i>
        <div class="notification-badge"></div>
      </button>
      <div class="profile-char" title="Account">
        <i class="fa-solid fa-user-astronaut"></i>
      </div>
    </div>
  </header>

  <div class="hero-body">
    <div class="hero-eyebrow">Your Journey Starts Here</div>
    <h1 class="hero-title">Travel <span class="grad">smarter,</span><br>fly further.</h1>
    <p class="hero-sub">Flights, hotels and experiences — search once and go.</p>

    <div class="search-card mode-flights" id="main-search-card">
      
      <svg class="bg-plane" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
        <path d="M21 16V14L13 9V3.5C13 2.67 12.33 2 11.5 2C10.67 2 10 2.67 10 3.5V9L2 14V16L10 13.5V19L8 20.5V22L11.5 21L15 22V20.5L13 19V13.5L21 16Z"/>
      </svg>

      <div class="mode-tabs">
        <button class="mode-tab active" id="tab-flights" onclick="switchMode('flights')">
          <i class="fa-solid fa-plane-up"></i> Flights
        </button>
        <button class="mode-tab" id="tab-hotels" onclick="switchMode('hotels')">
          <i class="fa-solid fa-bed"></i> Hotels
        </button>
        <button class="mode-tab" id="tab-exp" onclick="switchMode('exp')">
          <i class="fa-solid fa-compass"></i> Experiences
        </button>
      </div>

      <div class="search-panel active" id="panel-flights">
        <div class="trip-pills">
          <button class="trip-pill active" onclick="setTrip(this,'return')">Return</button>
          <button class="trip-pill" onclick="setTrip(this,'oneway')">One-way</button>
          <button class="trip-pill" onclick="setTrip(this,'multi')">Multi-city</button>
        </div>
        <div class="swap-wrap" style="margin-bottom:.75rem;">
          <div class="field" style="flex:1;">
            <label>From</label>
            <input type="text" id="f-from" placeholder="City or airport" value="Brussels (BRU)">
          </div>
          <button class="swap-btn" title="Swap" onclick="swapLocations()">
            <i class="fa-solid fa-arrow-right-arrow-left" style="transform:rotate(90deg)"></i>
          </button>
          <div class="field" style="flex:1;">
            <label>To</label>
            <input type="text" id="f-to" placeholder="City or airport" value="Singapore (SIN)">
          </div>
        </div>
        <div class="fields-row cols-4">
          <div class="field">
            <label>Depart</label>
            <input type="date" id="f-depart">
          </div>
          <div class="field" id="f-return-wrap">
            <label>Return</label>
            <input type="date" id="f-return">
          </div>
          <div class="field" style="position:relative;" onclick="toggleTravelers(event)">
            <label>Travelers</label>
            <input type="text" id="f-travelers-display" readonly placeholder="1 Adult" style="cursor:pointer;">
            <div class="travelers-popup-wrap" id="travelers-popup" onclick="event.stopPropagation()">
              <div class="t-row">
                <div><div class="t-label">Adults</div><div class="t-age">Age 12+</div></div>
                <div class="t-counter">
                  <button class="t-btn" id="a-minus" onclick="adj('a',-1)">−</button>
                  <span class="t-val" id="a-val">1</span>
                  <button class="t-btn" onclick="adj('a',1)">+</button>
                </div>
              </div>
              <div class="t-row">
                <div><div class="t-label">Children</div><div class="t-age">Age 2–11</div></div>
                <div class="t-counter">
                  <button class="t-btn" id="c-minus" onclick="adj('c',-1)">−</button>
                  <span class="t-val" id="c-val">0</span>
                  <button class="t-btn" onclick="adj('c',1)">+</button>
                </div>
              </div>
              <div class="t-row">
                <div><div class="t-label">Infants</div><div class="t-age">Under 2</div></div>
                <div class="t-counter">
                  <button class="t-btn" id="i-minus" onclick="adj('i',-1)">−</button>
                  <span class="t-val" id="i-val">0</span>
                  <button class="t-btn" onclick="adj('i',1)">+</button>
                </div>
              </div>
              <button class="t-done" onclick="closeTravelers()">Done</button>
            </div>
          </div>
          <div class="field">
            <label>Class</label>
            <select id="f-class">
              <option value="economy">Economy</option>
              <option value="premium">Premium</option>
              <option value="first">First Class</option>
            </select>
          </div>
        </div>
        <div class="search-btn-row">
          <button class="search-btn" onclick="searchFlights()">
            <i class="fa-solid fa-magnifying-glass"></i> Search Flights
          </button>
        </div>
      </div>

      <div class="search-panel" id="panel-hotels">
        <div class="fields-row cols-2" style="margin-bottom:.75rem;">
          <div class="field" style="grid-column:1/-1;">
            <label>Destination</label>
            <input type="text" id="h-dest" placeholder="City, hotel or landmark" value="Singapore">
          </div>
        </div>
        <div class="fields-row cols-4">
          <div class="field">
            <label>Check-in</label>
            <input type="date" id="h-checkin">
          </div>
          <div class="field">
            <label>Check-out</label>
            <input type="date" id="h-checkout">
          </div>
          <div class="field">
            <label>Guests</label>
            <select id="h-guests">
              <option>1 guest</option>
              <option selected>2 guests</option>
              <option>3 guests</option>
              <option>4 guests</option>
              <option>5+ guests</option>
            </select>
          </div>
          <div class="field">
            <label>Rooms</label>
            <select id="h-rooms">
              <option selected>1 room</option>
              <option>2 rooms</option>
              <option>3 rooms</option>
            </select>
          </div>
        </div>
        <div class="search-btn-row">
          <button class="search-btn" onclick="searchHotels()">
            <i class="fa-solid fa-magnifying-glass"></i> Search Hotels
          </button>
        </div>
      </div>

      <div class="search-panel" id="panel-exp">
        <div class="fields-row cols-3">
          <div class="field">
            <label>Location</label>
            <input type="text" id="e-dest" placeholder="City or region" value="Tokyo">
          </div>
          <div class="field">
            <label>When</label>
            <input type="date" id="e-date">
          </div>
          <div class="field">
            <label>Category</label>
            <select id="e-cat">
              <option value="all">All Experiences</option>
              <option value="adventure">Adventure</option>
              <option value="culture">Culture</option>
              <option value="food">Food</option>
            </select>
          </div>
        </div>
        <div class="search-btn-row">
          <button class="search-btn" onclick="searchExperiences()">
            <i class="fa-solid fa-magnifying-glass"></i> Find Experiences
          </button>
        </div>
      </div>

    </div>
  </div>

  <div class="trust-bar">
    <div class="trust-item"><i class="fa-solid fa-lock"></i> Secure booking</div>
    <div class="trust-item"><i class="fa-solid fa-rotate-left"></i> Free cancellation on most fares</div>
    <div class="trust-item"><i class="fa-solid fa-headset"></i> 24/7 support</div>
    <div class="trust-item"><i class="fa-solid fa-ticket"></i> Best price guarantee</div>
  </div>
</div>

<script src="dreamo-fixed/js/global.js"></script>
<script>
const BASE = 'dreamo-fixed/pages';

(function buildStars() {
  const c = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('span');
    const sz = Math.random() * 2.5 + .5;
    s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${(Math.random()*4+2).toFixed(1)}s;--o:${(Math.random()*.7+.1).toFixed(2)};animation-delay:${(Math.random()*5).toFixed(1)}s;`;
    c.appendChild(s);
  }
})();

(function setDates() {
  const pad = n => String(n).padStart(2,'0');
  const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const dep = new Date(); dep.setDate(dep.getDate()+14);
  const ret = new Date(); ret.setDate(ret.getDate()+25);
  
  // Flights
  document.getElementById('f-depart').value   = fmt(dep);
  document.getElementById('f-return').value   = fmt(ret);
  // Hotels
  document.getElementById('h-checkin').value  = fmt(dep);
  document.getElementById('h-checkout').value = fmt(ret);
  // Experiences
  document.getElementById('e-date').value = fmt(dep);
})();

function switchMode(m) {
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.search-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-'+m).classList.add('active');
  document.getElementById('panel-'+m).classList.add('active');

  // Control Airplane Animation class on the card
  const card = document.getElementById('main-search-card');
  if (m === 'flights') {
    card.classList.add('mode-flights');
  } else {
    card.classList.remove('mode-flights');
  }
}

function setTrip(el, type) {
  document.querySelectorAll('.trip-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('f-return-wrap').style.display = type === 'oneway' ? 'none' : '';
}
function swapLocations() {
  const a = document.getElementById('f-from'), b = document.getElementById('f-to');
  [a.value, b.value] = [b.value, a.value];
}

const PAX = { a:1, c:0, i:0 };
function toggleTravelers(e) { e.stopPropagation(); document.getElementById('travelers-popup').classList.toggle('open'); updateTravelersBtn(); }
function closeTravelers() { document.getElementById('travelers-popup').classList.remove('open'); }
function adj(k, d) {
  PAX[k] = Math.max(k==='a'?1:0, PAX[k]+d);
  document.getElementById(k+'-val').textContent = PAX[k];
  document.getElementById(k+'-minus').disabled = PAX[k] <= (k==='a'?1:0);
  updateTravelersBtn();
}
function updateTravelersBtn() {
  const p = [];
  if(PAX.a) p.push(PAX.a+' Adult'+(PAX.a>1?'s':''));
  if(PAX.c) p.push(PAX.c+' Child'+(PAX.c>1?'ren':''));
  if(PAX.i) p.push(PAX.i+' Infant'+(PAX.i>1?'s':''));
  document.getElementById('f-travelers-display').value = p.join(', ');
}
updateTravelersBtn();
document.addEventListener('click', () => closeTravelers());

function searchFlights() {
  const params = new URLSearchParams({
    from:   document.getElementById('f-from').value.trim(),
    to:     document.getElementById('f-to').value.trim(),
    depart: document.getElementById('f-depart').value,
    return: document.getElementById('f-return').value,
    pax:    `${PAX.a}a${PAX.c}c${PAX.i}i`,
    class:  document.getElementById('f-class').value
  });
  window.location.href = `${BASE}/aerofly.html?${params}`;
}
