<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>AeroFly Experiences</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Linking to your existing global styling -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/experiences.css">
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo-menu-group">
    <div class="hamburger" id="menuToggle"><span></span><span></span><span></span></div>
    <a class="logo" href="../index.html"><i class="fa-solid fa-sparkles"></i>AeroFly</a>
  </div>
  <div class="nav-dropdown" id="navDropdown">
    <a href="aerofly.html"><i class="fa-solid fa-plane-up" style="margin-right:8px;"></i> Flights</a>
    <a href="aerohotel.html"><i class="fa-solid fa-bed" style="margin-right:8px;"></i> Hotels</a>
    <a href="experiences.html" class="active-link"><i class="fa-solid fa-compass" style="margin-right:8px;"></i> Experiences<span class="nav-dot"></span></a>
  </div>
  <div class="user-actions">
    <button class="icon-btn" title="Notifications"><i class="fa-regular fa-bell"></i><div class="notification-badge"></div></button>
    <div class="profile-char" title="Account"><i class="fa-solid fa-user-astronaut"></i></div>
  </div>
</header>

<!-- HERO SECTION -->
<div class="exp-hero">
  <div class="exp-hero-inner">
    <h1>Discover <em>unforgettable</em><br>moments</h1>
    <p>Curated tours, extreme sports, and local secrets.</p>

    <div class="exp-search-bar">
      <div class="sb-field">
        <div class="sb-label">Location</div>
        <input type="text" class="sb-input" placeholder="Where to? (e.g. Tokyo)" id="exp-loc">
      </div>
      <div class="sb-field">
        <div class="sb-label">Category</div>
        <select class="sb-input" id="exp-cat">
          <option value="all">All Experiences</option>
          <option value="adventure">Adventure</option>
          <option value="culture">Culture & History</option>
          <option value="food">Food & Drink</option>
        </select>
      </div>
      <button class="sb-search-btn" onclick="filterExperiences()"><i class="fa-solid fa-magnifying-glass"></i> Explore</button>
    </div>
  </div>
</div>

<!-- EXPERIENCES GRID -->
<div class="page-body">
  <div class="exp-grid-header">
    <h2 id="exp-result-count">Trending Experiences</h2>
    <div class="sort-pills">
      <button class="sort-pill active">Top Rated</button>
      <button class="sort-pill">Price: Low to High</button>
    </div>
  </div>
  
  <div class="exp-grid" id="exp-grid">
    <!-- Populated by JavaScript -->
  </div>
</div>

<!-- BOOKING MODAL (Multi-step) -->
<div id="exp-modal-overlay">
  <div class="exp-modal">
    <div class="exp-modal-header">
      <h3 id="modal-exp-title">Experience Title</h3>
      <button class="exp-close-btn" onclick="closeExpModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="exp-modal-body">
      
      <!-- Step 1: Details & Date -->
      <div class="exp-step active" id="exp-step-1">
        <img src="" id="modal-exp-img" class="modal-hero-img" alt="Experience">
        <div class="modal-info">
          <div class="modal-tags" id="modal-exp-tags"></div>
          <p id="modal-exp-desc" class="modal-desc"></p>
          <div class="modal-price-row">
            <span class="price-big" id="modal-exp-price">$0</span> <span class="price-sub">/ person</span>
          </div>
        </div>
        <div class="booking-inputs">
          <div class="input-group">
            <label>Select Date</label>
            <input type="date" id="book-date" class="book-input">
          </div>
          <div class="input-group">
            <label>Travelers</label>
            <input type="number" id="book-ppl" min="1" max="10" value="2" class="book-input">
          </div>
        </div>
        <button class="modal-primary-btn" onclick="nextExpStep()">Continue to Details <i class="fa-solid fa-arrow-right"></i></button>
      </div>

      <!-- Step 2: Confirmation -->
      <div class="exp-step" id="exp-step-2">
        <h4>Review & Confirm</h4>
        <div class="receipt-card">
          <div class="receipt-row"><span>Date</span><strong id="receipt-date">-</strong></div>
          <div class="receipt-row"><span>Travelers</span><strong id="receipt-ppl">2</strong></div>
          <hr class="receipt-divider">
          <div class="receipt-row total"><span>Total</span><strong id="receipt-total" style="color: var(--purple);">$0</strong></div>
        </div>
        <div class="modal-actions">
          <button class="modal-secondary-btn" onclick="prevExpStep()">Back</button>
          <button class="modal-primary-btn" onclick="confirmExpBooking()">Confirm Booking <i class="fa-solid fa-check"></i></button>
        </div>
      </div>

      <!-- Step 3: Success -->
      <div class="exp-step" id="exp-step-3" style="text-align: center; padding: 2rem 0;">
        <i class="fa-solid fa-circle-check" style="font-size: 4rem; color: #4ade80; margin-bottom: 1rem;"></i>
        <h2>Booking Confirmed!</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Your tickets have been sent to your email.</p>
        <button class="modal-primary-btn" onclick="closeExpModal()">Back to Experiences</button>
      </div>

    </div>
  </div>
</div>

<script src="../js/global.js"></script>
<script src="../js/experiences.js"></script>
</body>
</html>
